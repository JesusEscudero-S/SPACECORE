# Variables de entorno del backend en Cloud Run.
# Se aplican con:  gcloud run services update spacecore-api --region us-east4 --env-vars-file infra/cloudrun.env.yaml
#
# CORS_ORIGINS: las páginas que pueden llamar a la API, separadas por comas, SIN barra al final.
# Cuando Vercel te dé la dirección de la página, agrégala aquí y vuelve a correr el comando.
CORS_ORIGINS: "https://spacecore.vercel.app,http://localhost:5173"
